global:
  scrape_interval: 5s

scrape_configs:
  - job_name: online-shop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: bombardier
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['bombardier:1234']
